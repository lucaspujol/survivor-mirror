services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geoemploi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geoemploi}
      POSTGRES_DB: ${POSTGRES_DB:-geoemploi}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # -h: without a host, pg_isready answers OK as soon as the temporary
      # initdb server is up, well before Postgres accepts TCP connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-geoemploi} -d ${POSTGRES_DB:-geoemploi}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ./api
    # Migrations, then the demo dataset, then the server. The seed is
    # idempotent: restarting the stack never duplicates anything.
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-geoemploi}:${POSTGRES_PASSWORD:-geoemploi}@db:5432/${POSTGRES_DB:-geoemploi}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRE_DAYS: ${JWT_EXPIRE_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOADS_DIR: /app/uploads
    volumes:
      - ./api:/app
      # CVs and cover letters live on disk, not in the base: a named volume
      # keeps them across a rebuild of the api image.
      - api_uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    command: npm run dev
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
  api_uploads:
