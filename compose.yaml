services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geoemploi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geoemploi}
      POSTGRES_DB: ${POSTGRES_DB:-geoemploi}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geoemploi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-geoemploi}:${POSTGRES_PASSWORD:-geoemploi}@db:5432/${POSTGRES_DB:-geoemploi}
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    command: npm run dev
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
