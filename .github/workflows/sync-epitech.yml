name: Sync to Epitech

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Force push (overwrites Epitech history)"
        type: boolean
        default: false

concurrency:
  group: sync-epitech
  cancel-in-progress: false

jobs:
  sync:
    # only run in the mirror; the Epitech copy of this file is inert
    if: github.repository == 'lucaspujol/survivor-mirror'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push main and tags to Epitech
        env:
          TOKEN: ${{ secrets.EPITECH_PUSH_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -eu
          git remote add epitech "https://x-access-token:${TOKEN}@github.com/EpitechPGE3-2026/G-SVR-500-MPL-5-1-survivor-2.git"
          if [ "${FORCE:-false}" = "true" ]; then
            git push --force epitech HEAD:refs/heads/main
            git push --force --tags epitech
          else
            git push epitech HEAD:refs/heads/main
            git push --tags epitech
          fi
